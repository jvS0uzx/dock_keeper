services:
  postgres:
    image: postgres:15-alpine
    container_name: dockkeeper_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-dockkeeper}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dockkeeper}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: dockkeeper_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-dockkeeper} port=5432 sslmode=disable TimeZone=UTC"
      API_TOKEN: ${API_TOKEN:?defina API_TOKEN no .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      SSH_KEY_PATH: /run/secrets/ssh_key
      SSH_KNOWN_HOSTS: /run/secrets/known_hosts
      TRUST_PROXY_HEADERS: "true"
      AGENT_INGEST_TOKEN: ${AGENT_INGEST_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - ${SSH_KEY_PATH:-~/.ssh/id_ed25519_vps}:/run/secrets/ssh_key:ro
      - ${SSH_KNOWN_HOSTS:-~/.ssh/known_hosts}:/run/secrets/known_hosts:ro
      - floorplans:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dockkeeper_frontend
    depends_on:
      - backend
    ports:
      - "${PANEL_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
  floorplans:
