services:
  postgres:
    image: postgres:15-alpine
    container_name: dockkeeper_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-dockkeeper}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-dockkeeper}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prepara-dados:
    image: alpine:3.20
    container_name: dockkeeper_prepara_dados
    command: sh -c "mkdir -p /app/data && chown -R ${DOCKKEEPER_UID:-1000}:${DOCKKEEPER_GID:-1000} /app/data"
    volumes:
      - floorplans:/app/data
    restart: "no"

  backend:
    build:
      context: ./backend
    container_name: dockkeeper_backend
    user: "${DOCKKEEPER_UID:-1000}:${DOCKKEEPER_GID:-1000}"
    depends_on:
      postgres:
        condition: service_healthy
      prepara-dados:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: "host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-dockkeeper} port=5432 sslmode=disable TimeZone=UTC"
      API_TOKEN: ${API_TOKEN:?defina API_TOKEN no .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8081}
      ADMIN_USER: ${ADMIN_USER:-admin}
      API_ADDR: ":8080"
      FLOORPLAN_DIR: data/floorplans
      SSH_KEY_PATH: /run/secrets/ssh_key
      SSH_KNOWN_HOSTS: /run/secrets/known_hosts
      TRUST_PROXY_HEADERS: "true"
    secrets:
      - ssh_key
      - known_hosts
    volumes:
      - floorplans:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: dockkeeper_frontend
    depends_on:
      - backend
    ports:
      - "${PANEL_BIND:-127.0.0.1}:${PANEL_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  pgdata:
  floorplans:

secrets:
  ssh_key:
    file: ${SSH_KEY_PATH:-~/.ssh/id_ed25519_vps}
  known_hosts:
    file: ${SSH_KNOWN_HOSTS:-~/.ssh/known_hosts}
