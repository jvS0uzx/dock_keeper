server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O painel é uma SPA: qualquer rota que não seja arquivo cai no index, senão
    # recarregar a página em /servidores devolve 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.json carrega a URL da API e é lido em tempo de execução. Não pode
    # ser cacheado: uma unidade que trocasse de endereço continuaria batendo no
    # antigo até o navegador expirar o cache sozinho.
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Mesma origem para a API. Evita CORS e faz a URL do backend deixar de ser
    # um dado de build.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # O painel usa SSE nas telas de tempo real. Sem desligar o buffer, o
        # nginx segura os eventos e a tela fica parada sem nenhum erro aparecer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
