name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: actions fixadas e downloads conferidos
        run: .github/scripts/confere-ci-fixado.sh

      - name: gitleaks
        env:
          VERSAO: 8.18.4
          SHA256: ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/gitleaks_${VERSAO}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --log-opts=--all
          ./gitleaks detect --redact --no-banner --config .gitleaks.toml --no-git

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: dockkeeper_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432

    env:
      DATABASE_URL: "postgres://postgres:ci@127.0.0.1:5432/dockkeeper_test?sslmode=disable"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          arquivos=$(gofmt -l .)
          if [ -n "$arquivos" ]; then
            echo "gofmt pendente em:"; echo "$arquivos"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -count=1 -race -p 1 ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: compose entrega o .env ao backend
        run: .github/scripts/confere-env-compose.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: oxlint
        run: npx oxlint

      - name: vitest
        run: npx vitest run

      - name: build
        run: npm run build

      - name: token nao vaza para o bundle
        env:
          VITE_API_TOKEN: canario-do-ci-nao-pode-aparecer-no-bundle
        run: |
          rm -rf dist
          npm run build
          if grep -rl "canario-do-ci-nao-pode-aparecer-no-bundle" dist/; then
            echo "FALHA: VITE_API_TOKEN foi embutido no build de producao."
            exit 1
          fi
          echo "OK: o token nao aparece em nenhum arquivo de dist/."
